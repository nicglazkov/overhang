name: Overhang
options:
  bundleIdPrefix: com.nic
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  Overhang:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: Overhang
        CFBundleDisplayName: Overhang
        CFBundleShortVersionString: "0.5.2"
        CFBundleVersion: "8"
        CFBundleIconFile: Overhang
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright © 2026 Nicholas Glazkov. MIT licensed."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nic.overhang
        MARKETING_VERSION: "0.5.2"
        CURRENT_PROJECT_VERSION: "8"
        SWIFT_VERSION: "5.0"
        # Ad-hoc by default so the project builds for anyone who clones it.
        #
        # Ad-hoc signatures rehash on every build, and Accessibility grants are bound to the
        # signature, so macOS revokes the grant after each rebuild. If you are iterating and
        # want the grant to stick, build with your own identity:
        #
        #   make install SIGN_ID="Apple Development: Your Name (XXXXXXXXXX)" TEAM_ID=YYYYYYYYYY
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        # Notarization rejects a signature without a secure timestamp, and rejects any binary
        # carrying the debug get-task-allow entitlement that Xcode injects by default.
        OTHER_CODE_SIGN_FLAGS: "--timestamp"
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        COMBINE_HIDPI_IMAGES: YES

  OverhangTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      # Compiled directly rather than via @testable import, so the tests are pure logic tests
      # with no host application and no launched UI. Keeps CI fast and headless.
      - path: Sources/StatusItemScanner.swift
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nic.overhang.tests
        CODE_SIGN_IDENTITY: "-"

schemes:
  Overhang:
    build:
      targets:
        Overhang: all
        OverhangTests: [test]
    test:
      targets:
        - OverhangTests
    run:
      config: Debug
