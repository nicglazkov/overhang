name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Logic tests only — no host app, no launched UI, so this runs headless.
      - name: Test
        run: |
          xcodebuild -project Overflow.xcodeproj -scheme Overflow \
            -derivedDataPath build CODE_SIGN_IDENTITY="-" test

      - name: Build release
        run: |
          xcodebuild -project Overflow.xcodeproj -scheme Overflow \
            -configuration Release -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" build

      - name: Package
        run: ditto -c -k --keepParent build/Build/Products/Release/Overflow.app Overflow.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Overflow.app
          path: Overflow.zip
